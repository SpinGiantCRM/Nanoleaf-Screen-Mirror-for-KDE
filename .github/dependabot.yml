version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directories:
      - /native
      - /native/app
      - /native/stream-probe
      - /native/gpu-probe
      - /native/linux-gpu
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      native-rust:
        patterns: ["*"]
