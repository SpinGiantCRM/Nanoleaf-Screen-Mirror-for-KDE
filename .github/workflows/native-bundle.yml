name: Native Rust bundle

concurrency:
  group: native-bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/native-v') }}

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      publish_release:
        type: boolean
        default: false
      release_tag:
        type: string
        default: ""
  workflow_dispatch:
  pull_request:
    paths:
      - "native/**"
      - "scripts/build_native_bundle.sh"
      - "scripts/generate_native_notices.py"
      - "scripts/verify_native_bundle.py"
      - "scripts/test_verify_native_bundle.py"
      - "scripts/publish_native_release.py"
      - "scripts/test_publish_native_release.py"
      - "scripts/build_native_wheel.py"
      - "scripts/test_build_native_wheel.py"
      - "scripts/verify_native_wheel.py"
      - "packaging/**"
      - "scripts/test_native_arch_package.py"
      - "scripts/test_native_bootstrap.py"
      - "docs/NATIVE_INSTALL.md"
      - "docs/RELEASE_2_0_0.md"
      - "assets/udev/**"
      - "assets/icons/**"
      - "LICENSE"
      - ".github/workflows/native-bundle.yml"
      - ".github/workflows/native-build.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  native-bundle:
    permissions:
      contents: read
    uses: ./.github/workflows/native-build.yml
    with:
      release_tag: ${{ inputs.release_tag }}

  publish-native:
    if: inputs.publish_release && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/native-v') && inputs.release_tag == github.ref_name
    needs: native-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: nanoleaf-native-linux-x86_64
          path: dist
      - name: Require passing CI on the final main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in ci.yml codeql.yml; do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$GITHUB_SHA" --branch main --json databaseId --jq '.[0].databaseId // empty')
            if [ -z "$run_id" ]; then
              echo "No main-branch validation found for this release revision: $workflow" >&2
              exit 1
            fi
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status
          done
      - name: Verify draft assets, then publish the native release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python scripts/publish_native_release.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --archive dist/native.tar.gz --notes docs/RELEASE_2_0_0.md
