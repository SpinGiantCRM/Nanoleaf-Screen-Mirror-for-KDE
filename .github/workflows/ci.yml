name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repository-contracts:
    name: Repository maintenance contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node --test scripts/cleanup_artifacts.test.cjs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify operator trace decoders and lint tools
        run: |
          python -m pip install ruff==0.15.13
          ruff check scripts/ tools/
          ruff format --check scripts/ tools/
          python -m unittest discover -s scripts -p 'test_*response_trace.py' -v
      - name: Verify offline receiver and ACK analysis controls
        run: |
          receiver_analysis_scripts=(
            perf/receiver-encoding-2026-10-16/crc_constraints.py
            perf/ack-path-2026-10-16/summarise_shape.py
            perf/firmware-models-2026-10-16/analyse_models.py
            perf/firmware-models-2026-10-16/padded_tail.py
          )
          ruff check "${receiver_analysis_scripts[@]}"
          ruff format --check "${receiver_analysis_scripts[@]}"
          python perf/receiver-encoding-2026-10-16/crc_constraints.py --self-test
          python perf/ack-path-2026-10-16/summarise_shape.py --check
          python perf/firmware-models-2026-10-16/analyse_models.py --self-test
          python perf/firmware-models-2026-10-16/padded_tail.py --self-test

  rust-security:
    name: Rust dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        id: audit-cache
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-audit-0.22.2
      - name: Install locked auditor
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 install cargo-audit --version 0.22.2 --locked
      - name: Audit every retained Rust workspace
        run: |
          cargo audit --file native/Cargo.lock
          for lock in native/app/Cargo.lock native/stream-probe/Cargo.lock native/gpu-probe/Cargo.lock native/linux-gpu/Cargo.lock; do
            cargo audit --no-fetch --file "$lock"
          done

  rust-core:
    name: Rust core contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust core toolchain
        run: |
          rustup toolchain install 1.77.0 --profile minimal --component rustfmt --component clippy
      - name: Check Rust core at its minimum supported compiler
        run: |
          cargo +1.77.0 fmt --manifest-path native/Cargo.toml --check
          cargo +1.77.0 clippy --manifest-path native/Cargo.toml --all-targets --locked --offline -- -D warnings
          cargo +1.77.0 test --manifest-path native/Cargo.toml --locked --offline
          cargo +1.77.0 build --manifest-path native/Cargo.toml --release --locked --offline

  rust-application:
    name: Rust application colour and lifecycle contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config dbus-daemon libegl1-mesa-dev libgl1-mesa-dev libxkbcommon-dev libwayland-dev
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          cargo +1.95.0 fetch --manifest-path native/app/Cargo.toml --locked
      - name: Verify Rust application at its minimum compiler
        run: |
          cargo +1.95.0 fmt --manifest-path native/app/Cargo.toml --check
          cargo +1.95.0 clippy --manifest-path native/app/Cargo.toml --features gui --all-targets --locked --offline -- -D warnings
          cargo +1.95.0 test --manifest-path native/app/Cargo.toml --features gui --all-targets --locked --offline
          cargo +1.95.0 build --manifest-path native/app/Cargo.toml --features gui --release --locked --offline

  rust-streaming:
    name: Rust streaming permission and interop contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install native capture build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config dbus-daemon libpipewire-0.3-dev libudev-dev libclang-dev
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          cargo +1.95.0 fetch --manifest-path native/stream-probe/Cargo.toml --locked
          cargo +1.95.0 fetch --manifest-path native/linux-gpu/Cargo.toml --locked
          cargo +1.95.0 fetch --manifest-path native/gpu-probe/Cargo.toml --locked
      - name: Verify supervised capture without display or USB access
        run: |
          cargo +1.95.0 fmt --manifest-path native/stream-probe/Cargo.toml --check
          cargo +1.95.0 fmt --manifest-path native/linux-gpu/Cargo.toml --check
          cargo +1.95.0 fmt --manifest-path native/gpu-probe/Cargo.toml --check
          cargo +1.95.0 clippy --manifest-path native/stream-probe/Cargo.toml --all-targets --locked --offline -- -D warnings
          cargo +1.95.0 test --manifest-path native/stream-probe/Cargo.toml --locked --offline
          cargo +1.95.0 clippy --manifest-path native/linux-gpu/Cargo.toml --all-targets --locked --offline -- -D warnings
          cargo +1.95.0 test --manifest-path native/linux-gpu/Cargo.toml --locked --offline
          cargo +1.95.0 clippy --manifest-path native/gpu-probe/Cargo.toml --all-targets --locked --offline -- -D warnings
          cargo +1.95.0 test --manifest-path native/gpu-probe/Cargo.toml --all-targets --locked --offline
          cargo +1.95.0 build --manifest-path native/stream-probe/Cargo.toml --release --bins --locked --offline
      # Hardware shader/import and emitted-light checks remain local evidence.

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep-sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Semgrep scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python
          audit_on: push
          generate_sarif: true
      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: semgrep.sarif
