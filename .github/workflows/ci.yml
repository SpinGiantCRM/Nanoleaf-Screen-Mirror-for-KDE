name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repository-contracts:
    name: Repository maintenance contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node --test scripts/cleanup_artifacts.test.cjs

  rust-security:
    name: Rust dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        id: audit-cache
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-audit-0.22.2
      - name: Install locked auditor
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 install cargo-audit --version 0.22.2 --locked
      - name: Audit every retained Rust workspace
        run: |
          cargo audit --file native/Cargo.lock
          for lock in native/app/Cargo.lock native/stream-probe/Cargo.lock native/gpu-probe/Cargo.lock native/linux-gpu/Cargo.lock native/python-bridge/Cargo.lock; do
            cargo audit --no-fetch --file "$lock"
          done

  tests:
    name: Legacy Python reference (py${{ matrix.python-version }})
    # PRs retain one legacy Python oracle; weekly CI checks its full version
    # matrix and dependency drift. The commands remain aligned.
    # Intentional: ubuntu-latest validates packaging-agnostic Python behavior;
    # KDE/Wayland integration checks are covered manually in release RC matrix.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The calibration gate needs the real PR base and merge history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev libegl1 libgl1 libxkbcommon0

      - name: Build DRM helper binary
        run: bash scripts/build_drm_helper.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Keep CI tooling explicit so lint/type/test commands remain available,
          # even if optional extras resolution changes across pip/setuptools versions.
          pip install -e .[test] pytest-cov ruff mypy

      - name: Validate version metadata
        run: python scripts/check_release_versions.py

      - name: Validate runtime install
        run: python scripts/verify_runtime_install.py

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/

      - name: Type check
        run: mypy src/nanoleaf_sync --ignore-missing-imports --follow-imports=silent

      - name: Calibration guardrails
        if: github.event_name == 'pull_request'
        run: python scripts/check_calibration_guardrails.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"

      - name: Run tests
        run: pytest -q --timeout=60 --timeout-method=thread --durations=25 --cov=nanoleaf_sync --cov-report=term-missing --cov-fail-under=75

  rust-core:
    name: Rust core contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install prototype verification dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libegl1 libgl1 libxkbcommon0
          pip install -e .
          rustup toolchain install 1.77.0 --profile minimal --component rustfmt --component clippy
      - name: Check Rust core at its minimum supported compiler
        run: |
          cargo +1.77.0 fmt --manifest-path native/Cargo.toml --check
          cargo +1.77.0 clippy --manifest-path native/Cargo.toml --all-targets --locked --offline -- -D warnings
          cargo +1.77.0 test --manifest-path native/Cargo.toml --locked --offline
          cargo +1.77.0 build --manifest-path native/Cargo.toml --release --locked --offline
      - name: Verify shared Python and Rust fixtures
        run: |
          python scripts/benchmark_rust_core.py --quick --iterations 3 --warmup 1 --repeats 1 --output native-parity.json

  rust-application:
    name: Rust application colour and lifecycle contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install native build and oracle dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config dbus-daemon libegl1-mesa-dev libgl1-mesa-dev libxkbcommon-dev libwayland-dev
          pip install -e .
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          cargo +1.95.0 fetch --manifest-path native/app/Cargo.toml --locked
      - name: Verify Rust application at its minimum compiler
        run: |
          cargo +1.95.0 fmt --manifest-path native/app/Cargo.toml --check
          cargo +1.95.0 clippy --manifest-path native/app/Cargo.toml --features gui --all-targets --locked --offline -- -D warnings
          cargo +1.95.0 test --manifest-path native/app/Cargo.toml --features gui --locked --offline
          cargo +1.95.0 build --manifest-path native/app/Cargo.toml --features gui --release --locked --offline
      - name: Verify complete colour and protocol replay
        run: |
          python scripts/benchmark_native_app.py --quick --legacy-black-hold-oracle --frames 12 --repeats 1 --output native-application-parity.json
          python scripts/benchmark_native_app.py --quick --no-accumulation --sampling-mode peak_luma --frames 4 --repeats 1 --output native-peak-parity.json
          python scripts/benchmark_native_app.py --quick --no-accumulation --sampling-mode vivid_weighted --frames 4 --repeats 1 --output native-vivid-parity.json

  rust-streaming:
    name: Rust streaming permission and interop contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install native capture build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config dbus-daemon libpipewire-0.3-dev libudev-dev libclang-dev
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          cargo +1.95.0 fetch --manifest-path native/stream-probe/Cargo.toml --locked
      - name: Verify supervised capture without display or USB access
        run: |
          cargo +1.95.0 fmt --manifest-path native/stream-probe/Cargo.toml --check
          cargo +1.95.0 fmt --manifest-path native/linux-gpu/Cargo.toml --check
          cargo +1.95.0 fmt --manifest-path native/gpu-probe/Cargo.toml --check
          cargo +1.95.0 clippy --manifest-path native/stream-probe/Cargo.toml --all-targets --locked --offline -- -D warnings
          cargo +1.95.0 test --manifest-path native/stream-probe/Cargo.toml --locked --offline
          cargo +1.95.0 build --manifest-path native/stream-probe/Cargo.toml --release --bins --locked --offline
      # Hardware shader/import and emitted-light checks remain local evidence.

  rust-bridge:
    name: Optional Rust bridge (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install development verification dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libegl1 libgl1 libxkbcommon0
          pip install -e '.[test]'
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - name: Build and verify the optional bridge
        env:
          RUSTUP_TOOLCHAIN: "1.85.0"
        run: |
          cargo fmt --manifest-path native/python-bridge/Cargo.toml --check
          python scripts/build_rust_bridge.py
          cargo clippy --manifest-path native/python-bridge/Cargo.toml --all-targets --locked --offline -- -D warnings
          export NANOLEAF_RUST_BRIDGE="$(python -c 'import pathlib,sysconfig; print(pathlib.Path("native/target/bridge") / ("_nanoleaf_core" + sysconfig.get_config_var("EXT_SUFFIX")))')"
          python -m pytest -q tests/test_rust_sampling_bridge.py tests/test_rust_adaptive.py --timeout=60 --timeout-method=thread
          python scripts/benchmark_rust_bridge.py --bridge "$NANOLEAF_RUST_BRIDGE" --quick --iterations 3 --warmup 1 --repeats 1 --output bridge-parity.json
          python scripts/benchmark_rust_adaptive.py --bridge "$NANOLEAF_RUST_BRIDGE" --quick --frames 12 --repeats 1 --output adaptive-parity.json

  benchmark:
    name: Performance baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run benchmark and compare baseline
        run: |
          nanoleaf-kde-sync-benchmark --preset production --json perf/result.json --compare perf/baseline.json

  wheel-contents-audit:
    name: Wheel contents audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libc6-dev

      - name: Build DRM helper binary
        run: bash scripts/build_drm_helper.sh

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip install build wheel
          python -m build --wheel

      - name: Validate wheel contents
        run: python scripts/validate_wheel.py dist/*-linux_x86_64.whl

  arch-metadata:
    name: Arch package metadata
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Arch package metadata
        uses: ./.github/actions/arch-metadata-validation

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    name: Security (bandit + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install security tools
        run: pip install bandit pip-audit
      - name: Run bandit
        run: bandit -r src/ -c pyproject.toml
      - name: Run pip-audit (runtime deps)
        run: bash scripts/pip_audit_runtime.sh

  semgrep-sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Semgrep scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python
          audit_on: push
          generate_sarif: true
      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.38.3
        with:
          sarif_file: semgrep.sarif
