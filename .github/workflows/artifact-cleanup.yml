name: Artifact cleanup
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List candidates without deleting them"
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify retention policy
        run: node --test scripts/cleanup_artifacts.test.cjs
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          script: |
            const {cleanup} = require('./scripts/cleanup_artifacts.cjs');
            await cleanup({github, context, core, dryRun: process.env.DRY_RUN !== 'false'});
