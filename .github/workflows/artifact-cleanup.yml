name: Artifact cleanup
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete old artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10,
            });

            const latest = releases.find(r => !r.prerelease);
            const latestPre = releases.find(r => r.prerelease);

            const keepRunIds = new Set();
            for (const rel of [latest, latestPre].filter(Boolean)) {
              try {
                const runs = await github.rest.actions.listWorkflowRunsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  event: "push",
                  branch: rel.tag_name,
                  per_page: 3,
                });
                for (const run of runs.data.workflow_runs) {
                  keepRunIds.add(run.id);
                }
              } catch {}
            }

            let deleted = 0;
            for (const art of artifacts.artifacts) {
              if (keepRunIds.has(art.workflow_run?.id)) continue;
              if (art.expired) continue;
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: art.id,
              });
              deleted++;
            }
            core.info(`Deleted ${deleted} artifacts, kept ${keepRunIds.size} release runs`);
