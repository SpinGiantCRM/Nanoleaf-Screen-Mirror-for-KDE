[package]
name = "nanoleaf-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
default-run = "nanoleaf-native"
license-file = "../../LICENSE"

[workspace]

[dependencies]
nanoleaf-core = { path = "../core" }
anyhow = "1.0"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
toml_edit = "0.23"
rustix = { version = "1.1", features = ["fs", "event", "pipe", "process", "net", "time"] }
zbus = "=5.19.0"
async-io = "=2.6.0"
futures-lite = "=2.6.1"
hidapi = { version = "=2.6.7", default-features = false, features = ["linux-native-basic-udev"] }
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "unstable"] }
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "accesskit"], optional = true }
url = { version = "2.5", optional = true }

[features]
default = []
gui = ["dep:eframe", "dep:url"]

[[bin]]
name = "capture_scene"
path = "src/bin/capture_scene.rs"
required-features = ["gui"]

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
