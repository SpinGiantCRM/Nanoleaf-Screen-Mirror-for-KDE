[package]
name = "nanoleaf-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license-file = "../../LICENSE"

[workspace]

[dependencies]
nanoleaf-core = { path = "../core" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
toml_edit = "0.23"
rustix = { version = "1.1", features = ["fs", "event", "pipe", "process", "net"] }
zbus = "=5.19.0"
hidapi = { version = "=2.6.7", default-features = false, features = ["linux-native-basic-udev"] }
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "accesskit"], optional = true }

[features]
default = []
gui = ["dep:eframe"]

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
