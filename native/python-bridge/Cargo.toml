[package]
name = "nanoleaf-python-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license-file = "../../LICENSE"
build = "../core/build.rs"

# Separate workspace keeps the dependency-free core's Rust 1.77/offline gate.
[workspace]

[lib]
name = "_nanoleaf_core"
crate-type = ["cdylib"]

[dependencies]
nanoleaf-core = { path = "../core" }
pyo3 = "=0.29.3"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
