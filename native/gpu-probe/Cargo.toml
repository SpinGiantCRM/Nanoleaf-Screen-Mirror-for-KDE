[package]
name = "nanoleaf-vulkan-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license-file = "../../LICENSE"

[workspace]

[dependencies]
nanoleaf-core = { path = "../core" }
anyhow = "1.0"
serde_json = "1.0"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
