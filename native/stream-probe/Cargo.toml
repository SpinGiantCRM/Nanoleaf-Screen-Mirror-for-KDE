[package]
name = "nanoleaf-stream-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license-file = "../../LICENSE"

[workspace]

[dependencies]
anyhow = "1.0"
log = "0.4"
serde_json = "1.0"
rustix = { version = "1.1", features = ["time", "param", "fs"] }
zbus = "=5.19.0"
pipewire = { version = "=0.10.1", features = ["v0_3_65"] }
nanoleaf-linux-gpu = { path = "../linux-gpu" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
nanoleaf-core = { path = "../core" }
nanoleaf-vulkan-probe = { path = "../gpu-probe" }

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
